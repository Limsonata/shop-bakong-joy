<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1a1d" />
      <stop offset="100%" stop-color="#090809" />
    </radialGradient>

    <!-- Metallic Rose Gold/Pink Gradient -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAD0C4" />
      <stop offset="50%" stop-color="#E8A7B8" />
      <stop offset="100%" stop-color="#C5798B" />
    </linearGradient>

    <!-- Ribbon Highlight Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE3EC" />
      <stop offset="50%" stop-color="#E8A7B8" />
      <stop offset="100%" stop-color="#9E5265" />
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Circular Background -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" />

  <!-- Outer Double Rings -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#roseGold)" stroke-width="2" opacity="0.8" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#roseGold)" stroke-width="1" opacity="0.5" />

  <!-- Integrated Clothes Hanger -->
  <g transform="translate(250, 105)" stroke="url(#roseGold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hook -->
    <path d="M 0,0 C -8,-12 -5,-25 5,-25 C 13,-25 15,-15 8,-8 C 5,-5 0,-2 0,5" stroke-width="3" />
    <!-- Hanger Body -->
    <path d="M 0,5 L -65,38 C -70,41 -65,48 -58,48 L 58,48 C 65,48 70,41 65,38 Z" stroke-width="2.5" fill="#121012" />
    <!-- Heart in Hanger -->
    <path d="M -4,22 A 3,3 0 0,1 0,19 A 3,3 0 0,1 4,22 Q 4,26 0,29 Q -4,26 -4,22 Z" fill="url(#roseGold)" stroke="none" />
  </g>

  <!-- Monogram: B G -->
  <g id="monogram" fill="url(#roseGold)" filter="url(#glow)">
    <!-- Letter B -->
    <text x="145" y="240" font-family="'Playfair Display', 'Didot', 'Georgia', serif" font-size="145" font-weight="bold" letter-spacing="-5">B</text>
    <!-- Letter G -->
    <text x="245" y="270" font-family="'Playfair Display', 'Didot', 'Georgia', serif" font-size="145" font-weight="bold" letter-spacing="-5">G</text>
  </g>

  <!-- Elegant Bow Tie (Centered on B) -->
  <g id="bow" transform="translate(180, 205)">
    <!-- Left Loop -->
    <path d="M 0,0 C -35,-25 -45,10 -5,10 Z" fill="url(#ribbonGrad)" stroke="#68313F" stroke-width="0.5"/>
    <path d="M 0,0 C -25,-15 -35,5 -5,5 Z" fill="#FCE3EC" opacity="0.4"/>
    
    <!-- Right Loop -->
    <path d="M 0,0 C 35,-25 45,10 5,10 Z" fill="url(#ribbonGrad)" stroke="#68313F" stroke-width="0.5"/>
    <path d="M 0,0 C 25,-15 35,5 5,5 Z" fill="#FCE3EC" opacity="0.4"/>

    <!-- Left Ribbon Tail -->
    <path d="M -3,5 Q -25,25 -35,50 Q -20,45 -10,38 Q -5,20 -1,8 Z" fill="url(#ribbonGrad)"/>
    
    <!-- Right Ribbon Tail -->
    <path d="M 3,5 Q 15,30 35,45 Q 20,42 8,35 Q 3,20 1,8 Z" fill="url(#ribbonGrad)"/>

    <!-- Center Knot -->
    <rect x="-6" y="-4" width="12" height="12" rx="4" fill="url(#roseGold)" stroke="#68313F" stroke-width="0.5"/>
  </g>

  <!-- Sparkles / Stars -->
  <g fill="url(#roseGold)">
    <!-- Top Left Sparkle -->
    <path d="M 125,160 Q 125,170 115,170 Q 125,170 125,180 Q 125,170 135,170 Q 125,170 125,160 Z" />
    <path d="M 105,185 Q 105,190 100,190 Q 105,190 105,195 Q 105,190 110,190 Q 105,190 105,185 Z" opacity="0.7"/>
    
    <!-- Right Sparkle -->
    <path d="M 400,220 Q 400,230 390,230 Q 400,230 400,240 Q 400,230 410,230 Q 400,230 400,220 Z" />
    <path d="M 415,250 Q 415,253 412,253 Q 415,253 415,256 Q 415,253 418,253 Q 415,253 415,250 Z" opacity="0.7"/>
  </g>

  <!-- Typography Section -->
  <!-- BILLIE GRACE -->
  <text x="250" y="360" text-anchor="middle" font-family="'Cinzel', 'Cormorant Garamond', 'Times New Roman', serif" font-size="28" font-weight="600" fill="url(#roseGold)" letter-spacing="8">
    BILLIE GRACE
  </text>

  <!-- Divider Line with Center Heart -->
  <g transform="translate(0, 378)">
    <line x1="130" y1="0" x2="230" y2="0" stroke="url(#roseGold)" stroke-width="1.5" opacity="0.7"/>
    <!-- Center Heart -->
    <path d="M 250,-4 A 3.5,3.5 0 0,0 245,-1 A 3.5,3.5 0 0,0 250,3 A 3.5,3.5 0 0,0 255,-1 A 3.5,3.5 0 0,0 250,-4 Z" fill="url(#roseGold)"/>
    <line x1="270" y1="0" x2="370" y2="0" stroke="url(#roseGold)" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- CLOTHING -->
  <text x="250" y="410" text-anchor="middle" font-family="'Montserrat', 'Helvetica', 'Arial', sans-serif" font-size="15" font-weight="400" fill="#E8A7B8" letter-spacing="12">
    CLOTHING
  </text>
</svg>
